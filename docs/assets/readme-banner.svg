<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">NHOP — New Hire Orientation Program</title>
  <desc id="desc">Narrated slide presentations from existing PPTX files.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d0b1f"/><stop offset="1" stop-color="#1d1b4a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c4b5fd" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <path d="M0 280H1200" stroke="url(#accent)" stroke-width="4"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="64" fill="#a78bfa" font-size="14" letter-spacing="4">FPT SOFTWARE PHILIPPINES  /  NEO FORCE BATCH 5</text>
    <text x="60" y="140" fill="#f8fafc" font-size="64" font-weight="800">NHOP</text>
    <text x="64" y="186" fill="#38bdf8" font-size="30" font-weight="600" letter-spacing="4">NEW HIRE ORIENTATION PROGRAM</text>
    <text x="65" y="224" fill="#94a3b8" font-size="18">Narrated slide presentations from existing PPTX files.</text>
    <g font-size="13" font-weight="600" fill="#e2e8f0">
      <rect x="64" y="244" width="90" height="26" rx="13" fill="#253049"/><text x="80" y="262">UIPATH</text>
      <rect x="170" y="244" width="90" height="26" rx="13" fill="#253049"/><text x="186" y="262">PYTHON</text>
      <rect x="276" y="244" width="90" height="26" rx="13" fill="#253049"/><text x="292" y="262">FFMPEG</text>
    </g>
    <g transform="translate(922 48)">
      <rect width="204" height="204" rx="36" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="22" y="22" width="160" height="160" rx="25" fill="none" stroke="url(#accent)" stroke-width="2"/>
      <text x="102" y="136" text-anchor="middle" fill="#a78bfa" font-size="110" font-weight="800">N</text>
      <circle cx="181" cy="24" r="7" fill="#38bdf8"/>
    </g>
  </g>
</svg>
